apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-server-everything-wrong.fullname" . }}-auth
  labels:
    {{- include "mcp-server-everything-wrong.labels" . | nindent 4 }}
type: Opaque
data:
  MCP_AUTH_TOKEN: {{ required "auth.token is required (e.g. --set auth.token=$(openssl rand -hex 32))" .Values.auth.token | b64enc | quote }}
