services:
  chat:
    image: acuvity/mcp-client-chatbot:1.0.0
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
    labels:
      - type=chat
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - type: bind
        source: ./data
        target: /data

  mcp-server-everything-wrong:
    image: acuvity/mcp-server-everything-wrong:latest
    labels:
      - type=mcp-server
    build:
      context: ..
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - OPENAI_API_KEY=thisIsNotArealAPIkeyButstill
      - GUARDRAILS=sensitive-pattern-detection secrets-redaction
    ports:
      # Loopback-only publish. Do NOT use "8000:8000" here: that exposes
      # run_command and env_var to anyone on your network. Note that MCP_HOST
      # must stay 0.0.0.0 — inside a container, binding loopback would make the
      # published port unreachable. Under Docker the port publish is the
      # exposure control, not MCP_HOST.
      - "127.0.0.1:8000:8000"
    restart: always
